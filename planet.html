<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pinkie Planet</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b1a12;--gold:#ffc83a;--gold-d:#e8932a;--panel:#fff6dc;--bg:#07051a;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07051a}}
:root[data-theme="dark"]{--bg:#07051a}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:'Lilita One','Trebuchet MS',Impact,sans-serif;color:var(--ink)}
canvas{display:block;touch-action:none;cursor:grab}
#ui{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.title{position:absolute;top:16px;left:16px;background:var(--panel);border:4px solid var(--ink);border-radius:14px;padding:6px 16px 8px;font-size:26px;letter-spacing:.5px;box-shadow:0 5px 0 var(--ink);transform:rotate(-1.5deg)}
.hint{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--panel);border:4px solid var(--ink);border-radius:14px;padding:6px 18px;font-size:19px;box-shadow:0 5px 0 var(--ink);white-space:nowrap;max-width:92vw;text-align:center;transition:opacity .4s}
.btn{position:absolute;top:16px;right:16px;pointer-events:auto;cursor:pointer;display:none;font:inherit;font-size:22px;color:#fff;text-shadow:0 2px 0 var(--ink);background:linear-gradient(#ffd95a,var(--gold-d));border:4px solid var(--ink);border-radius:14px;padding:6px 18px 8px;box-shadow:0 5px 0 var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible{outline:4px solid #fff}
#fade{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.hint{transition:none}}
</style>
</head>
<body>
<div id="ui">
  <div class="title">Pinkie Planet</div>
  <button class="btn" id="back">Back to space</button>
  <div class="hint" id="hint">Drag to look around. Click the pink planet to visit.</div>
</div>
<div id="fade"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(R.domElement);
const cv=R.domElement,hint=document.getElementById('hint'),back=document.getElementById('back'),fade=document.getElementById('fade');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
const tone=new THREE.DataTexture(new Uint8Array([120,185,230,255]),4,1,THREE.LuminanceFormat);
tone.minFilter=tone.magFilter=THREE.NearestFilter;tone.needsUpdate=true;
const M=c=>new THREE.MeshToonMaterial({color:c,gradientMap:tone});
const OB=new THREE.MeshBasicMaterial({color:0x2b1a12,side:THREE.BackSide});

/* ---------- SPACE ---------- */
const S=new THREE.Scene();S.background=new THREE.Color(0x07051a);
const sc=new THREE.PerspectiveCamera(50,1,.1,2000);
const sp={th:.6,ph:1.3,r:36};
// stars
{const n=3500,p=new Float32Array(n*3),col=new Float32Array(n*3),c=new THREE.Color();
 for(let i=0;i<n;i++){const u=Math.random()*2-1,a=Math.random()*6.283,r=Math.sqrt(1-u*u),d=rnd(350,800);
  p.set([r*Math.cos(a)*d,u*d,r*Math.sin(a)*d],i*3);
  c.setHSL(Math.random()<.3?rnd(.55,.65):rnd(.05,.15),.5,rnd(.7,1));col.set([c.r,c.g,c.b],i*3);}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));
 S.add(new THREE.Points(g,new THREE.PointsMaterial({size:1.8,sizeAttenuation:false,vertexColors:true})));}
// galaxies
const gals=[];
function galaxy(pos,c1,c2,scale,arms){
 const n=3500,p=new Float32Array(n*3),col=new Float32Array(n*3),a=new THREE.Color(c1),b=new THREE.Color(c2),c=new THREE.Color();
 for(let i=0;i<n;i++){const t=Math.pow(Math.random(),1.6),r=t*scale,ang=(i%arms)*6.283/arms+t*5,sp2=(1-t*.7)*scale*.07;
  p.set([Math.cos(ang)*r+rnd(-1,1)*sp2*2,rnd(-1,1)*sp2*.6,Math.sin(ang)*r+rnd(-1,1)*sp2*2],i*3);
  c.copy(a).lerp(b,t);col.set([c.r,c.g,c.b],i*3);}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));
 const m=new THREE.Points(g,new THREE.PointsMaterial({size:2.2,sizeAttenuation:false,vertexColors:true,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false}));
 m.position.set(...pos);m.rotation.set(rnd(.3,1.3),rnd(0,6),rnd(0,1));S.add(m);gals.push(m);}
galaxy([-170,50,-190],0xfff1c4,0x5a7bff,60,3);
galaxy([210,-40,-150],0xffd0f0,0x8a3cff,70,2);
galaxy([40,150,-240],0xc8f2ff,0x2d6bff,55,4);
galaxy([-230,-70,90],0xffe0a8,0xff4f7a,50,3);
galaxy([190,70,200],0xe7ffe0,0x2cc7a8,45,2);
// planet
const tc=document.createElement('canvas');tc.width=512;tc.height=256;
{const g=tc.getContext('2d');
 for(let y=0;y<256;y++){const v=Math.sin(y*.09)*.5+Math.sin(y*.23+1)*.25;g.fillStyle=`hsl(${330+v*12},88%,${66+v*9}%)`;g.fillRect(0,y,512,1);}
 for(let i=0;i<45;i++){g.fillStyle='rgba(255,255,255,.14)';g.beginPath();g.ellipse(rnd(0,512),rnd(0,256),rnd(10,50),rnd(3,10),0,0,7);g.fill();}}
const pTex=new THREE.CanvasTexture(tc);
const planetG=new THREE.Group();S.add(planetG);
const planet=new THREE.Mesh(new THREE.SphereGeometry(5,48,36),new THREE.MeshToonMaterial({map:pTex,gradientMap:tone}));
planetG.add(planet);
planetG.add(new THREE.Mesh(new THREE.SphereGeometry(5.5,32,24),new THREE.MeshBasicMaterial({color:0xff7fc0,transparent:true,opacity:.18,side:THREE.BackSide,blending:THREE.AdditiveBlending,depthWrite:false})));
const ringTilt=new THREE.Group();planetG.add(ringTilt);
[[7.2,9.2,0xffd9ee,.95],[9.6,10.6,0xf59ccb,.85],[11,12.4,0xffc2e2,.6]].forEach(([a,b,c,o])=>{
 const r=new THREE.Mesh(new THREE.RingGeometry(a,b,96),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o,side:THREE.DoubleSide}));
 r.rotation.x=Math.PI/2;ringTilt.add(r);});
ringTilt.rotation.set(.38,0,-.3);
S.add(new THREE.AmbientLight(0xffffff,.55));
const sun=new THREE.DirectionalLight(0xffffff,.9);sun.position.set(30,20,25);S.add(sun);

/* ---------- VILLAGE ---------- */
const V=new THREE.Scene();V.background=new THREE.Color(0x8fd8ff);
const vc=new THREE.PerspectiveCamera(28,1,.1,500);
const vp={th:Math.PI/4,r:34,el:.62};
V.add(new THREE.AmbientLight(0xffffff,.7));
const vl=new THREE.DirectionalLight(0xffffff,.85);vl.position.set(8,14,6);V.add(vl);
function mk(g,c,x,y,z,o=1.07,par=V){const m=new THREE.Mesh(g,M(c));m.position.set(x,y,z);
 if(o){const l=new THREE.Mesh(g,OB);l.scale.setScalar(o);m.add(l);}par.add(m);return m;}
const B=(w,h,d)=>new THREE.BoxGeometry(w,h,d);
// island
mk(B(14,2,14),0x9b6a3c,0,-1.5,0,1.02);
for(let i=0;i<14;i++)for(let j=0;j<14;j++){
 const cx=i-6.5,cz=j-6.5;if(cx>-3&&cx<3&&cz>-6&&cz<-3)continue;
 mk(B(1,.5,1),(i+j)%2?0x78d13c:0x69c231,cx,-.25,cz,0);}
// pond
mk(B(6,.35,3),0x3fb7ff,0,-.325,-4.5,0);
[[0,-6.1,6.8,.4],[0,-2.9,6.8,.4],[-3.1,-4.5,.4,3.2],[3.1,-4.5,.4,3.2]].forEach(([x,z,w,d])=>mk(B(w,.3,d),0xc4bcae,x,.05,z,1.08));
const pads=[[-1.6,-5.3],[1.9,-3.7]];
pads.forEach(([x,z])=>{mk(new THREE.CylinderGeometry(.4,.4,.06,14),0x3fc25a,x,-.14,z,1.1);mk(new THREE.SphereGeometry(.12,8,6),0xff8fc7,x+.1,-.06,z,0);});
// house
mk(B(4,3,3.5),0xf6d9a0,0,1.5,.5);
const roof=mk(new THREE.ConeGeometry(3.3,2,4),0xe5533d,0,4,.5,1.05);roof.rotation.y=Math.PI/4;roof.scale.z=.9;
mk(B(.9,1.6,.12),0x7a4a26,0,.8,2.28,1.1);
mk(B(.1,.1,.1),0xffd23a,.25,.8,2.36,0);
[-1.2,1.2].forEach(x=>{mk(B(.8,.8,.12),0x6fd3ff,x,1.9,2.28,1.1);mk(B(1,.15,.2),0x7a4a26,x,1.4,2.33,1.1);});
mk(B(.7,1.4,.7),0xb5543a,1.2,4.3,-.3);
mk(B(1.4,.18,.8),0xc4bcae,0,.09,2.65,1.06);
[[0,3.5],[.2,4.4],[0,5.3]].forEach(([x,z])=>mk(B(.9,.08,.7),0xd9c79b,x,.04,z,1.06));
// trees, bushes, flowers
function tree(x,z,s){const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);V.add(g);
 mk(new THREE.CylinderGeometry(.22,.3,1.2,8),0x8a5a2b,0,.6,0,1.1,g);
 mk(new THREE.IcosahedronGeometry(1.2,1),0x3fae3a,0,1.9,0,1.06,g);mk(new THREE.IcosahedronGeometry(.8,1),0x57c64a,.5,2.5,.2,1.06,g);}
tree(-5.2,-5,1);tree(5.4,-4.6,1.1);tree(-5.4,3.2,1.2);tree(5.2,4.6,.9);tree(-5.5,-.5,.8);
[[-2.6,2.6],[2.8,2.4],[3.4,-.8],[-3.6,.8]].forEach(([x,z])=>mk(new THREE.IcosahedronGeometry(.55,1),0x4fc043,x,.45,z,1.1));
for(let i=0;i<22;i++){const x=rnd(-6.4,6.4),z=rnd(-6.4,6.4);if(Math.abs(x)<3&&z>-6.3&&z<-2.7||Math.abs(x)<2.4&&z>-1.5&&z<6)continue;
 mk(new THREE.SphereGeometry(.12,6,5),[0xffffff,0xff6b9a,0xffe23a][i%3],x,.12,z,0);}
// ducks
const ducks=[];
function duck(s){const g=new THREE.Group();g.scale.setScalar(s);
 const body=mk(new THREE.SphereGeometry(.3,14,10),0xffd93b,0,.18,0,1.1,g);body.scale.set(1,.85,1.25);
 mk(new THREE.SphereGeometry(.2,12,10),0xffd93b,0,.5,.25,1.1,g);
 mk(B(.14,.07,.16),0xff8a1f,0,.46,.5,1.1,g);
 [-.09,.09].forEach(x=>mk(new THREE.SphereGeometry(.035,6,5),0x111111,x,.56,.4,0,g));
 mk(new THREE.ConeGeometry(.1,.2,4),0xffd93b,0,.2,-.38,1.1,g).rotation.x=-1.9;
 g.userData.duck=true;V.add(g);ducks.push(g);return g;}
duck(1.5);for(let i=0;i<4;i++)duck(.85);
// clouds
const clouds=[];
for(let i=0;i<5;i++){const g=new THREE.Group();[[0,0,1.6],[1.6,-.2,1.2],[-1.5,-.3,1.1],[.4,.5,1.2]].forEach(([x,y,r])=>{
 const m=new THREE.Mesh(new THREE.SphereGeometry(r,12,10),new THREE.MeshBasicMaterial({color:0xffffff}));m.position.set(x,y,0);g.add(m);});
 g.position.set(rnd(-30,30),rnd(8,14),rnd(-25,-8));g.scale.set(1,.6,.8);V.add(g);clouds.push(g);}

/* ---------- STATE / INPUT ---------- */
let mode='space',down=null,drag=0,quackT=0;
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function pick(e,objs,cam){ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,cam);return ray.intersectObjects(objs,true);}
cv.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};drag=0;cv.style.cursor='grabbing';});
addEventListener('pointermove',e=>{
 if(down){const dx=e.clientX-down.x,dy=e.clientY-down.y;drag+=Math.abs(dx)+Math.abs(dy);down={x:e.clientX,y:e.clientY};
  if(mode==='space'){sp.th-=dx*.006;sp.ph=clamp(sp.ph-dy*.006,.35,2.8);}
  else if(mode==='village'){vp.th-=dx*.006;vp.el=clamp(vp.el+dy*.004,.35,1.1);}}
 else if(mode==='space'){const h=pick(e,[planet],sc).length>0;cv.style.cursor=h?'pointer':'grab';planetG.scale.setScalar(h?1.05:1);}});
addEventListener('pointerup',e=>{
 const wasClick=down&&drag<6;down=null;cv.style.cursor='grab';if(!wasClick)return;
 if(mode==='space'&&pick(e,[planet],sc).length)enter();
 else if(mode==='village'){const h=pick(e,ducks,vc);if(h.length){let o=h[0].object;while(o&&!o.userData.duck)o=o.parent;if(o){o.userData.jump=1;hint.textContent='Quack!';quackT=1.5;}}}});
addEventListener('wheel',e=>{if(mode==='space')sp.r=clamp(sp.r+e.deltaY*.03,18,70);else if(mode==='village')vp.r=clamp(vp.r+e.deltaY*.02,22,50);},{passive:true});
const tween=(d,f)=>new Promise(res=>{const s=performance.now();(function t(){const k=Math.min(1,(performance.now()-s)/d);f(k);k<1?requestAnimationFrame(t):res();})();});
const ease=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
async function enter(){
 mode='busy';hint.style.opacity=0;const r0=sp.r;
 await tween(1800,k=>{sp.r=r0+(7.5-r0)*ease(k);fade.style.opacity=k>.72?(k-.72)/.28:0;});
 mode='village';back.style.display='block';hint.textContent='Drag to look around. Click a duck.';hint.style.opacity=1;
 await tween(900,k=>{vp.r=60-26*ease(k);fade.style.opacity=1-k;});
}
back.onclick=async()=>{
 if(mode!=='village')return;mode='busy';hint.style.opacity=0;
 await tween(600,k=>fade.style.opacity=k);
 back.style.display='none';sp.r=7.5;mode='space';
 await tween(1400,k=>{sp.r=7.5+28.5*ease(k);fade.style.opacity=1-Math.min(1,k*2);});
 hint.textContent='Drag to look around. Click the pink planet to visit.';hint.style.opacity=1;
};

/* ---------- LOOP ---------- */
function resize(){R.setSize(innerWidth,innerHeight);[sc,vc].forEach(c=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();});}
addEventListener('resize',resize);resize();
const clock=new THREE.Clock();
function loop(){
 requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
 if(mode!=='village'){
  if(mode==='space'&&!down)sp.th+=dt*.05;
  planet.rotation.y+=dt*.08;gals.forEach((g,i)=>g.rotation.y+=dt*.01*(i%2?1:-1));
  sc.position.set(sp.r*Math.sin(sp.ph)*Math.cos(sp.th),sp.r*Math.cos(sp.ph),sp.r*Math.sin(sp.ph)*Math.sin(sp.th));
  sc.lookAt(0,0,0);R.render(S,sc);
 }else{
  vc.position.set(vp.r*Math.cos(vp.el)*Math.sin(vp.th),.5+vp.r*Math.sin(vp.el),vp.r*Math.cos(vp.el)*Math.cos(vp.th));
  vc.lookAt(0,1,-.5);
  ducks.forEach((d,i)=>{const a=t*.5-i*.42+.5,dx=-2*Math.sin(a),dz=.8*Math.cos(a);
   const j=d.userData.jump||0;d.userData.jump=Math.max(0,j-dt*2.2);
   d.position.set(2*Math.cos(a),-.12+Math.sin(t*3+i)*.025+Math.sin((1-j)*Math.PI)*.5*(j>0),-4.5+.8*Math.sin(a));
   d.rotation.y=Math.atan2(dx,dz);});
  clouds.forEach(c=>{c.position.x+=dt*.6;if(c.position.x>34)c.position.x=-34;});
  if(quackT>0){quackT-=dt;if(quackT<=0)hint.textContent='Drag to look around. Click a duck.';}
  R.render(V,vc);
 }
}
loop();
</script>
</body>
</html>
